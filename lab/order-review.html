<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Review Console | Dan Ross</title>
    <link rel="stylesheet" href="../css/lab/order-review.css" />
  </head>
  <body>
    <main>
      <h1>Order Review Console</h1>
      <p>
        An interactive order management tool for identifying orders that require
        attention due to processing delays, inventory issues, or other business
        rules.
      </p>
      <label for="review-only"
        ><input type="checkbox" id="review-only" /> Show only orders needing
        review
      </label>
      <table>
        <caption>
          Order overview
        </caption>
        <thead>
          <tr>
            <th scope="col" aria-sort="none"><button type="button" id="sort-order-id">Order ID <span aria-hidden="true" id="sort-order-id-indicator">↕</span></button></th>
            <th scope="col">Status</th>
            <th scope="col">Payment</th>
            <th scope="col">Inventory</th>
            <th scope="col">Waiting</th>
            <th scope="col">Review</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>
    <script src="../js/lab/order-review.js"></script>
  </body>
</html>
