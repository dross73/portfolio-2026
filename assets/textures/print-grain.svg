<svg
  xmlns="http://www.w3.org/2000/svg"
  width="192"
  height="192"
  viewBox="0 0 192 192"
>
  <defs>
    <filter
      id="print-grain"
      x="0"
      y="0"
      width="100%"
      height="100%"
      color-interpolation-filters="sRGB"
    >
      <!-- Fine dark ink speckles -->
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.72"
        numOctaves="2"
        seed="37"
        stitchTiles="stitch"
        result="dark-noise"
      />

      <feColorMatrix
        in="dark-noise"
        type="luminanceToAlpha"
        result="dark-luminance"
      />

      <feComponentTransfer
        in="dark-luminance"
        result="dark-alpha"
      >
        <feFuncA
          type="table"
          tableValues="0 0 0 0 0 0 0.015 0.04 0.08"
        />
      </feComponentTransfer>

      <feFlood
        flood-color="#000000"
        result="black"
      />

      <feComposite
        in="black"
        in2="dark-alpha"
        operator="in"
        result="dark-specks"
      />

      <!-- Fine light areas where the ink appears thinner -->
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.9"
        numOctaves="2"
        seed="73"
        stitchTiles="stitch"
        result="light-noise"
      />

      <feColorMatrix
        in="light-noise"
        type="luminanceToAlpha"
        result="light-luminance"
      />

      <feComponentTransfer
        in="light-luminance"
        result="light-alpha"
      >
        <feFuncA
          type="table"
          tableValues="0.055 0.025 0.008 0 0 0 0 0 0"
        />
      </feComponentTransfer>

      <feFlood
        flood-color="#ffffff"
        result="white"
      />

      <feComposite
        in="white"
        in2="light-alpha"
        operator="in"
        result="light-specks"
      />

      <feMerge>
        <feMergeNode in="dark-specks" />
        <feMergeNode in="light-specks" />
      </feMerge>
    </filter>
  </defs>

  <rect
    width="192"
    height="192"
    fill="transparent"
    filter="url(#print-grain)"
  />
</svg>